title: Poster
author: F. Cecillon
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    html:
      template: poster-html/template.html

      # Styles (screen and print)
      css:
        - poster-html/poster.css
        - poster-html/poster-print.css

      # Lua filter for content classification and region building
      filters:
        - poster-html/poster.lua

      # Layout: custom tells Quarto not to inject its own
      # column grid or document-content wrappers.
      # Our template owns the full page structure.
      page-layout: custom

      # Suppress Quarto defaults that don't apply to posters
      toc: false
      number-sections: false
      code-fold: false
      smooth-scroll: false